<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecurePass - Password Strength Analyzer</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>SecurePass</h1>
        <p>Advanced password strength analysis</p>
      </div>

      <div class="input-section">
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Enter your password..." autocomplete="off">
          <button id="copy-btn" class="unicode-btn" disabled>
            <span class="btn-icon">⧉</span>
          </button>
        </div>
      </div>

      <div class="strength-section">
        <div class="strength-header">
          <span class="strength-label">Password Strength</span>
          <span id="strength-text" class="strength-value">None</span>
        </div>
        <div class="strength-meter">
          <div id="strength-bar" class="strength-bar"></div>
        </div>
      </div>

      <div class="analysis-section">
        <div class="analysis-item">
          <span class="analysis-label">Length</span>
          <span id="length-status" class="analysis-status">0/12</span>
        </div>
        <div class="analysis-item">
          <span class="analysis-label">Character Types</span>
          <span id="types-status" class="analysis-status">0/4</span>
        </div>
        <div class="analysis-item">
          <span class="analysis-label">Complexity</span>
          <span id="complexity-status" class="analysis-status">Low</span>
        </div>
      </div>

      <div class="requirements-section">
        <h3>Requirements</h3>
        <div class="requirements-grid">
          <div id="req-length" class="requirement">12+ characters</div>
          <div id="req-uppercase" class="requirement">Uppercase letters</div>
          <div id="req-lowercase" class="requirement">Lowercase letters</div>
          <div id="req-numbers" class="requirement">Numbers</div>
          <div id="req-special" class="requirement">Special characters</div>
          <div id="req-no-seq" class="requirement">No sequences</div>
          <div id="req-no-repeat" class="requirement">No repeats</div>
          <div id="req-no-common" class="requirement">No common words</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
